# ServiceMonitor for Prometheus Operator
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloistr-email
  namespace: coldforge
  labels:
    app.kubernetes.io/name: cloistr-email
    release: prometheus  # Match your Prometheus Operator installation
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cloistr-email
      app.kubernetes.io/component: backend
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
    scheme: http
  namespaceSelector:
    matchNames:
    - coldforge
# Alert rules are NOT here. No Prometheus loads PrometheusRule CRs on
# atlantis; the email alerts live in Atlas
# roles/kube/external-monitoring/rules/cloistr-email-alerts.yml.
